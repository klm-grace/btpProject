# Infrastructure locale de développement — PostgreSQL + Redis
# Bind STRICTEMENT sur 127.0.0.1 (jamais 0.0.0.0)
# Credentials de dev uniquement via .env (jamais hardcodés dans le code app)

services:
  postgres:
    image: postgres:18-alpine
    container_name: btp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-btp_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-btp_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18+ : monter /var/lib/postgresql (pas /var/lib/postgresql/data)
      # pour permettre pg_upgrade propre ; les données vivent dans data/db.
      - ./data/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btp_dev} -d ${POSTGRES_DB:-btp_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - btp-internal

  redis:
    image: redis:alpine
    container_name: btp-redis
    restart: unless-stopped
    # Mot de passe dev via .env (placeholder dans .env.example) — non exposé publiquement.
    # protected-mode actif + mot de passe = connexions uniquement autorisées avec AUTH.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-btp_dev_redis_password}
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:-btp_dev_redis_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - btp-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: btp-api:latest
    container_name: btp-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DB_URL: postgresql://btp_dev:btp_dev_password@postgres:5432/btp_dev
      REDIS_URL: redis://:btp_dev_redis_password@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs:rw
      - ./logs-backup:/app/logs/backup:rw
    networks:
      - btp-internal

networks:
  btp-internal:
    name: btp-internal
    driver: bridge
