# Infrastructure — PostgreSQL + Redis + VictoriaLogs + Nginx + API
# Version: Docker Compose v5.4.0

services:
  # ==========================================
  # BASE INFRASTRUCTURE
  # ==========================================
  
  postgres:
    image: postgres:18-alpine
    container_name: btp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-btp_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-btp_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-btp_dev} -d ${POSTGRES_DB:-btp_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - btp-internal

  redis:
    image: redis:alpine
    container_name: btp-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-btp_dev_redis_password}
    command: >
      redis-server --appendonly yes
      --requirepass ${REDIS_PASSWORD:-btp_dev_redis_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - btp-internal

  # ==========================================
  # LOGS STACK (VictoriaLogs) - ~300MB RAM
  # ==========================================
  
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: btp-victorialogs
    restart: unless-stopped
    ports:
      - "0.0.0.0:9428:9428"
    volumes:
      - ./logs/victorialogs:/victoria-logs-data
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=7d"
      - "-httpListenAddr=:9428"
    networks:
      - btp-internal
    deploy:
      resources:
        limits:
          memory: 300m
          cpus: '0.15'
        reservations:
          memory: 128m

  # ==========================================
  # APPLICATION
  # ==========================================

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: btp-api:latest
    container_name: btp-api
    restart: unless-stopped
    # Plus aucune exposition publique directe : accès UNIQUEMENT via nginx.
    # Le port n'est pas publié sur l'hôte (réseau interne btp-internal).
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://btp_dev:btp_dev_password@postgres:5432/btp_dev
      REDIS_URL: redis://:btp_dev_redis_password@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: "true"
      LOG_LEVEL: info
      LOG_DIR: /app/logs
      LOG_MAX_SIZE_BYTES: "10485760"
      LOG_MAX_FILES: "5"
      LOG_DISK_MAX_PERCENT: "90"
      LOG_FLUSH_INTERVAL_MS: "100"
      LOG_MAX_QUEUE_SIZE: "200"
      LOG_LOKI_ENABLED: "true"
      LOG_LOKI_URL: http://victorialogs:9428/insert/loki/api/v1/push
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
    volumes:
      - ./logs:/app/logs:rw
      - ./logs-backup:/app/logs/backup:rw
    networks:
      - btp-internal

  # ==========================================
  # REVERSE PROXY (Nginx) — point d'entrée public
  # ==========================================

  nginx:
    image: nginx:1.27-alpine
    container_name: btp-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    networks:
      - btp-internal

networks:
  btp-internal:
    name: btp-internal
    driver: bridge