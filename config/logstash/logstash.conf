# Logstash Configuration — BTP Project
# Parse JSON logs from app and security files
# Forward to Elasticsearch

input {
  # === Application Logs ===
  file {
    path => "/app/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "app-log"
    tags => ["btp", "app"]
  }

  # === Security Logs ===
  file {
    path => "/app/logs/security.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "security-log"
    tags => ["btp", "security", "intrusion-detection"]
  }

  # === Docker Container Logs ===
  file {
    path => "/var/lib/docker/containers/*/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "docker-log"
    tags => ["docker"]
  }
}

filter {
  # === App & Security Logs Parsing ===
  if [type] == "app-log" or [type] == "security-log" {
    # Extract level
    if [level] {
      mutate {
        add_field => { "log_level" => "%{level}" }
      }
    }
    
    # Extract context fields
    if [ctx] {
      if [ctx][userId] {
        mutate { add_field => { "user_id" => "%{[ctx][userId]}" } }
      }
      if [ctx][ip] {
        mutate { add_field => { "client_ip" => "%{[ctx][ip]}" } }
      }
      if [ctx][email] {
        mutate { add_field => { "email" => "%{[ctx][email]}" } }
      }
      if [ctx][reason] {
        mutate { add_field => { "failure_reason" => "%{[ctx][reason]}" } }
      }
      if [ctx][type] {
        mutate { add_field => { "intrusion_type" => "%{[ctx][type]}" } }
      }
      if [ctx][endpoint] {
        mutate { add_field => { "endpoint" => "%{[ctx][endpoint]}" } }
      }
    }

    # Map severity for Elasticsearch
    if [level] == "error" {
      mutate { add_field => { "severity" => "high" } }
    } else if [level] == "warn" {
      mutate { add_field => { "severity" => "medium" } }
    } else if [level] == "info" {
      mutate { add_field => { "severity" => "low" } }
    }
  }

  # === Docker Logs Parsing ===
  if [type] == "docker-log" {
    grok {
      match => { "log" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}" }
    }
  }
}

output {
  # === Elasticsearch Output ===
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "btp-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ELASTIC_PASSWORD:-changeme}"
    document_type => "_doc"
  }

  # === Console Output (debug) ===
  stdout {
    codec => dots
  }
}
