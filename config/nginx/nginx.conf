# ═══════════════════════════════════════════════════════════════
# Nginx — configuration principale (durcie)
# Reverse proxy pour l'API Bun (btp-api)
# ═══════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ── MIME / fichiers ──────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    # ── Map : header Connection pour les websockets ──────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── Masquer la version nginx (fingerprinting) ────────────────
    server_tokens off;

    # ── Performance ──────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;          # uploads médias
    server_names_hash_bucket_size 64;

    # ── Anti slowloris / timeouts ────────────────────────────────
    client_body_timeout 15;
    client_header_timeout 15;
    send_timeout 15;
    reset_timedout_connection on;

    # ── Tampons (anti-header overflow) ───────────────────────────
    client_body_buffer_size 32k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Logs formatés ────────────────────────────────────────────
    log_format main escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ── Taux global (par IP) ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_log_level warn;

    # ── Zones de rate-limit renforcées (routes sensibles) ────────
    # auth = login (bruteforce), public = formulaires exposés
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_public:10m rate=10r/s;

    # ── Sites ────────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}